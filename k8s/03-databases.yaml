# ==========================================
# MONGODB STATEFULSET & SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: inventory-prod
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongo-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db
  namespace: inventory-prod
spec:
  serviceName: mongo-service
  replicas: 1

  selector:
    matchLabels:
      app: mongo-db

  template:
    metadata:
      labels:
        app: mongo-db

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 999

      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017

          envFrom:
            - secretRef:
                name: database-credentials

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc

---
# ==========================================
# REDIS CACHE STATEFULSET & SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: inventory-prod
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis-cache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cache
  namespace: inventory-prod
spec:
  serviceName: redis-service
  replicas: 1

  selector:
    matchLabels:
      app: redis-cache

  template:
    metadata:
      labels:
        app: redis-cache

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 999

      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 20
            periodSeconds: 20

          volumeMounts:
            - name: redis-storage
              mountPath: /data

      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

name: CI/CD Pipeline - Backend

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend CI (Syntax & Compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        run: |
          python -m py_compile $(find app -name "*.py")
          python -m py_compile sync_schema.py check_and_seed_db.py apply_release_setup.py

  deploy:
    name: Deploy FastAPI Backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "=========================================="
            echo "==> Deploying Backend to ${{ secrets.SERVER_HOST }}..."
            echo "=========================================="

            APP_DIR="/var/www/saas"
            BACKEND_DIR="$APP_DIR/backend"

            if [ ! -d "$BACKEND_DIR" ]; then
              echo "Error: Backend directory $BACKEND_DIR does not exist."
              exit 1
            fi

            cd "$BACKEND_DIR"
            git config --global --add safe.directory "$BACKEND_DIR"

            BRANCH="${{ github.ref_name }}"
            echo "==> Fetching latest changes from branch $BRANCH..."
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            # Sync docker-compose.prod.yml if changed
            cp -f "$BACKEND_DIR/deploy/docker-compose.prod.yml" "$APP_DIR/docker-compose.prod.yml" 2>/dev/null || true

            COMPOSE="docker compose -f $APP_DIR/docker-compose.prod.yml"

            echo "==> Building backend image..."
            $COMPOSE build saas_backend

            # Postgres runs on this host, so the one thing the application
            # cannot do for itself can be done from here. Adding a column
            # needs OWNERSHIP of the table - GRANT ALL is not enough - and a
            # deploy that cannot add a column leaves the new code running
            # against a database missing it. Hand the tables over once; after
            # that this finds nothing to do.
            APP_DB_USER="$(grep -E '^[[:space:]]*POSTGRES_USER=' "$BACKEND_DIR/.env" | tail -1 | cut -d= -f2- | tr -d "\"' ")" || true
            APP_DB_NAME="$(grep -E '^[[:space:]]*POSTGRES_DB=' "$BACKEND_DIR/.env" | tail -1 | cut -d= -f2- | tr -d "\"' ")" || true

            if [ -z "$APP_DB_USER" ] || [ -z "$APP_DB_NAME" ]; then
              echo "==> Table ownership: skipped, POSTGRES_USER/POSTGRES_DB not readable from backend/.env"
            elif ! sudo -n -u postgres psql -d "$APP_DB_NAME" -Atc 'SELECT 1' > /dev/null 2>&1; then
              echo "==> Table ownership: skipped, no local postgres superuser access from this host"
            else
              OWNED_BY_OTHERS="$(sudo -n -u postgres psql -d "$APP_DB_NAME" -Atc \
                "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tableowner <> '$APP_DB_USER'")"

              if [ "${OWNED_BY_OTHERS:-0}" = "0" ]; then
                echo "==> Table ownership: '$APP_DB_USER' already owns every table"
              else
                echo "==> Table ownership: handing $OWNED_BY_OTHERS table(s) to '$APP_DB_USER'..."
                sudo -n -u postgres psql -d "$APP_DB_NAME" -Atc \
                  "SELECT format('ALTER TABLE public.%I OWNER TO %I;', tablename, '$APP_DB_USER')
                   FROM pg_tables WHERE schemaname='public' AND tableowner <> '$APP_DB_USER'" \
                  | sudo -n -u postgres psql -d "$APP_DB_NAME" -q -v ON_ERROR_STOP=1 -f -
                echo "==> Table ownership: done, the application can migrate itself from now on"
              fi
            fi

            # The schema is brought up to date BEFORE the new code goes live.
            # It used to run after, so a refused migration left the new
            # container serving against the old database and every request
            # touching the missing column returned a 500. Failing here now
            # leaves the previous container running and the site up.
            echo "==> Migrating the database before switching over..."
            $COMPOSE run --rm --no-deps -T saas_backend python sync_schema.py
            $COMPOSE run --rm --no-deps -T saas_backend python apply_crm_workflow_schema.py

            echo "==> Starting backend container..."
            $COMPOSE up -d saas_backend

            echo "==> Seeding..."
            $COMPOSE exec -T saas_backend python check_and_seed_db.py
            $COMPOSE exec -T saas_backend python apply_release_setup.py

            echo "==> Waiting for backend healthcheck..."
            sleep 4
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:8050/api/v1/health > /dev/null; then
                echo "==> Backend is healthy and responding!"
                exit 0
              fi
              echo "Waiting for health check ($i/10)..."
              sleep 2
            done

            echo "Health check timed out! Recent container logs:"
            docker compose -f "$APP_DIR/docker-compose.prod.yml" logs --tail=50 saas_backend
            exit 1

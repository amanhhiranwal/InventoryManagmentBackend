services:
  backend_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.1.173}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-crm_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Masters@123}
      - POSTGRES_DB=${POSTGRES_DB:-solutions}
      - MONGO_URI=${MONGO_URI:-mongodb://192.168.1.173:27017}
      - MONGO_DB=${MONGO_DB:-solutions}
      - REDIS_HOST=${REDIS_HOST:-192.168.1.173}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONPATH=/app

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.1.173}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${AUTH_DB:-auth_db}
      - MONGO_URI=${MONGO_URI:-mongodb://192.168.1.173:27017/}
      - REDIS_HOST=${REDIS_HOST:-192.168.1.173}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONPATH=/app

  crm_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    command: uvicorn services.crm_service.main:app --host 0.0.0.0 --port 8002 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.1.173}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${CRM_DB:-crm_db}
      - MONGO_URI=${MONGO_URI:-mongodb://192.168.1.173:27017/}
      - REDIS_HOST=${REDIS_HOST:-192.168.1.173}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONPATH=/app

  inventory_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    command: uvicorn services.inventory_service.main:app --host 0.0.0.0 --port 8003 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.1.173}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${INVENTORY_DB:-inventory_db}
      - MONGO_URI=${MONGO_URI:-mongodb://192.168.1.173:27017/}
      - REDIS_HOST=${REDIS_HOST:-192.168.1.173}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONPATH=/app

  sales_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_service
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - .:/app
    command: uvicorn services.sales_service.main:app --host 0.0.0.0 --port 8004 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.1.173}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${SALES_DB:-sales_db}
      - MONGO_URI=${MONGO_URI:-mongodb://192.168.1.173:27017/}
      - REDIS_HOST=${REDIS_HOST:-192.168.1.173}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONPATH=/app

  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8080}:8000"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - crm_service
      - inventory_service
      - sales_service
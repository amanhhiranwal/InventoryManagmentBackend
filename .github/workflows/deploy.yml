
name: CI/CD Pipeline - Backend

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

# Prevent overlapping deployments to the same branch.
concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Backend CI (Syntax & Compilation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==> Checking Python files under app/..."

          if [ ! -d app ]; then
            echo "::error::The app directory does not exist."
            exit 1
          fi

          mapfile -t APP_FILES < <(
            find app -type f -name "*.py" -print | sort
          )

          if [ "${#APP_FILES[@]}" -eq 0 ]; then
            echo "::error::No Python files found under app/."
            exit 1
          fi

          python -m py_compile "${APP_FILES[@]}"

          echo "==> Checking root-level deployment scripts..."

          REQUIRED_FILES=(
            sync_schema.py
            apply_crm_workflow_schema.py
            check_and_seed_db.py
            apply_release_setup.py
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi

            python -m py_compile "$file"
          done

          echo "==> All Python syntax checks passed."

  deploy:
    name: Deploy FastAPI Backend
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -Eeuo pipefail

            trap 'rc=$?; echo "ERROR: Deployment failed at line ${LINENO}, exit code ${rc}."; exit "$rc"' ERR

            echo "=========================================="
            echo "==> Starting FastAPI backend deployment"
            echo "=========================================="

            APP_DIR="/var/www/saas"
            BACKEND_DIR="$APP_DIR/backend"
            COMPOSE_FILE="$APP_DIR/docker-compose.prod.yml"

            # Validate deployment directories.
            if [ ! -d "$BACKEND_DIR" ]; then
              echo "ERROR: Backend directory does not exist: $BACKEND_DIR"
              exit 1
            fi

            cd "$BACKEND_DIR"

            git config --global --add safe.directory "$BACKEND_DIR"

            # Accept only the configured deployment branches.
            BRANCH="${{ github.ref_name }}"

            case "$BRANCH" in
              main|prod)
                ;;
              *)
                echo "ERROR: Unsupported deployment branch: $BRANCH"
                exit 1
                ;;
            esac

            echo "==> Deployment branch: $BRANCH"

            # Update the local checkout.
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            # Use the deployment compose file from the checked-out revision.
            if [ -f "$BACKEND_DIR/deploy/docker-compose.prod.yml" ]; then
              cp -f \
                "$BACKEND_DIR/deploy/docker-compose.prod.yml" \
                "$COMPOSE_FILE"
            elif [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: Docker Compose production file not found."
              exit 1
            else
              echo "NOTICE: Keeping the existing production Compose file."
            fi

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: Missing Compose file: $COMPOSE_FILE"
              exit 1
            fi

            # Use an array so paths and arguments are passed correctly.
            COMPOSE=(docker compose -f "$COMPOSE_FILE")

            echo "==> Validating Docker Compose configuration..."
            "${COMPOSE[@]}" config --quiet

            # Build the new image before changing the running service.
            echo "==> Building backend image..."
            "${COMPOSE[@]}" build saas_backend

            # Ensure required deployment scripts are present.
            for file in \
              sync_schema.py \
              apply_crm_workflow_schema.py \
              check_and_seed_db.py \
              apply_release_setup.py
            do
              if [ ! -f "$BACKEND_DIR/$file" ]; then
                echo "ERROR: Required script is missing: $file"
                exit 1
              fi
            done

            # Read PostgreSQL role/database settings.
            # The application .env file must contain these values.
            APP_DB_USER="$(
              grep -E '^[[:space:]]*POSTGRES_USER=' "$BACKEND_DIR/.env" \
                | tail -1 \
                | cut -d= -f2- \
                | tr -d "\"' " || true
            )"

            APP_DB_NAME="$(
              grep -E '^[[:space:]]*POSTGRES_DB=' "$BACKEND_DIR/.env" \
                | tail -1 \
                | cut -d= -f2- \
                | tr -d "\"' " || true
            )"

            # Transfer table ownership only when local PostgreSQL
            # superuser access is available.
            if [ -z "$APP_DB_USER" ] || [ -z "$APP_DB_NAME" ]; then
              echo "NOTICE: Skipping table ownership check."
              echo "POSTGRES_USER or POSTGRES_DB was not found in backend/.env."

            elif ! sudo -n -u postgres psql \
              -d "$APP_DB_NAME" -Atc 'SELECT 1' >/dev/null 2>&1; then

              echo "NOTICE: Local PostgreSQL superuser access unavailable."
              echo "Skipping ownership transfer."

            else
              # Quote identifiers safely using PostgreSQL format().
              OWNED_BY_OTHERS="$(
                sudo -n -u postgres psql \
                  -d "$APP_DB_NAME" -Atc \
                  "SELECT count(*)
                   FROM pg_tables
                   WHERE schemaname = 'public'
                     AND tableowner <> '$APP_DB_USER'"
              )"

              if [ "${OWNED_BY_OTHERS:-0}" = "0" ]; then
                echo "==> Table ownership already matches $APP_DB_USER."
              else
                echo "==> Transferring ownership of $OWNED_BY_OTHERS tables..."

                sudo -n -u postgres psql \
                  -d "$APP_DB_NAME" -Atc \
                  "SELECT format(
                     'ALTER TABLE %I.%I OWNER TO %I;',
                     schemaname,
                     tablename,
                     '$APP_DB_USER'
                   )
                   FROM pg_tables
                   WHERE schemaname = 'public'
                     AND tableowner <> '$APP_DB_USER'" \
                  | sudo -n -u postgres psql \
                      -d "$APP_DB_NAME" \
                      -v ON_ERROR_STOP=1 \
                      -q \
                      -f -

                echo "==> Table ownership transfer completed."
              fi
            fi

            # Run database migrations before starting the new application.
            echo "=========================================="
            echo "==> Running database migrations"
            echo "=========================================="

            echo "==> Step 1/2: sync_schema.py"
            "${COMPOSE[@]}" run --rm --no-deps -T \
              saas_backend python -u sync_schema.py

            echo "==> Step 2/2: apply_crm_workflow_schema.py"
            "${COMPOSE[@]}" run --rm --no-deps -T \
              saas_backend python -u apply_crm_workflow_schema.py

            echo "==> Database migration commands completed."

            # Start or recreate the backend using the new image.
            echo "==> Starting backend container..."
            "${COMPOSE[@]}" up -d --no-deps saas_backend

            # Confirm that the service is running.
            echo "==> Checking backend container status..."

            RUNNING=""

            for attempt in $(seq 1 15); do
              RUNNING="$(
                "${COMPOSE[@]}" ps --status running -q saas_backend
              )"

              if [ -n "$RUNNING" ]; then
                echo "==> Backend container is running."
                break
              fi

              echo "Waiting for backend container ($attempt/15)..."
              sleep 2
            done

            if [ -z "$RUNNING" ]; then
              echo "ERROR: Backend container did not start."
              "${COMPOSE[@]}" ps -a
              "${COMPOSE[@]}" logs --tail=100 saas_backend
              exit 1
            fi

            # Run the existing seed and release setup scripts.
            echo "==> Running database seeding..."
            "${COMPOSE[@]}" exec -T saas_backend \
              python -u check_and_seed_db.py

            echo "==> Applying release setup..."
            "${COMPOSE[@]}" exec -T saas_backend \
              python -u apply_release_setup.py

            # Validate the application using its existing health endpoint.
            echo "=========================================="
            echo "==> Waiting for backend health check"
            echo "=========================================="

            HEALTH_URL="http://127.0.0.1:8050/api/v1/health"
            HEALTHY=false

            for attempt in $(seq 1 15); do
              if curl --connect-timeout 3 --max-time 5 \
                --silent --show-error --fail \
                "$HEALTH_URL" >/dev/null 2>&1; then

                HEALTHY=true
                echo "==> Backend health check passed."
                break
              fi

              echo "Waiting for health check ($attempt/15)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Backend health check failed."
              echo "==> Container status:"
              "${COMPOSE[@]}" ps -a

              echo "==> Recent backend logs:"
              "${COMPOSE[@]}" logs --tail=100 saas_backend

              exit 1
            fi

            echo "=========================================="
            echo "==> Backend deployment completed successfully."
            echo "=========================================="

# Nginx configuration for CRM SaaS (Frontend + Backend)
# Domain: synergy-sync.com (HTTPS with Certbot)

server {
    server_name synergy-sync.com www.synergy-sync.com crm.synergy-global.io 45.195.159.94;

    client_max_body_size 100M;

    # Backend FastAPI documentation & OpenAPI schema
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8050/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Static media & uploads (avatars, document attachments)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8050/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Frontend (SSR, Client, & Static Assets)
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/synergy-sync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synergy-sync.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect all HTTP port 80 requests to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name synergy-sync.com www.synergy-sync.com crm.synergy-global.io 45.195.159.94;

    return 301 https://synergy-sync.com$request_uri;
}

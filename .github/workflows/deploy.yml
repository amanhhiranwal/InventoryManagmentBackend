name: Production Self-Hosted CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - master

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Hub Connectivity
        run: |
          curl -I https://registry-1.docker.io/v2/ || true
          curl -I https://auth.docker.io || true
            
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
              -t ${{ secrets.DOCKERHUB_USERNAME }}/inventory-backend:latest \
              -f Dockerfile .
      - name: Push Docker Image (with retry)
        shell: bash
        run: |
          set -e                  

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/inventory-backend:latest"

          for i in {1..5}; do
            echo "Docker Push Attempt $i..."

            if docker push "$IMAGE"; then
              echo "Docker image pushed successfully."
              exit 0
            fi

            echo "Push failed. Waiting 20 seconds..."
            sleep 20
          done

          echo "Docker push failed after 5 attempts."
          exit 1
          
      - name: Deploy Kubernetes Resources
        shell: bash
        run: |
          set -e

          export KUBECONFIG=$HOME/.kube/config

          echo "=================================================="
          echo "Deploying Namespace and ConfigMap..."
          echo "=================================================="
          kubectl apply -f k8s/01-namespace-and-secrets.yaml

          echo "=================================================="
          echo "Deploying Monitoring Namespace..."
          echo "=================================================="
          kubectl apply -f k8s/monitoring-namespace.yaml

          echo "=================================================="
          echo "Deploying Monitoring Stack..."
          echo "=================================================="

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
          helm repo add grafana https://grafana.github.io/helm-charts || true
          helm repo update

          helm_install_with_retry() {
            local release="$1"
            shift

            local max_attempts=5
            local attempt=1

            while true; do
              if helm upgrade --install "$release" "$@"; then
                echo "${release} installed/updated successfully."
                break
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "${release} installation failed after ${max_attempts} attempts."
                return 1
              fi

              attempt=$((attempt + 1))
              echo "Retrying ${release} in 15 seconds... ($attempt/${max_attempts})"
              sleep 15
            done
          }

          helm_install_with_retry kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f k8s/monitoring/kube-prometheus-stack-values.yaml \
            --wait \
            --timeout 15m

          helm_install_with_retry loki \
            grafana/loki \
            --namespace monitoring \
            -f k8s/monitoring/loki-values.yaml \
            --wait \
            --timeout 15m

          helm_install_with_retry alloy \
            grafana/alloy \
            --namespace monitoring \
            -f k8s/monitoring/alloy-values.yaml \
            --wait \
            --timeout 15m

          echo "=================================================="
          echo "Ensuring PostgreSQL bootstrap secret exists..."
          echo "=================================================="

          if ! kubectl get secret postgres-cluster-secret -n inventory-prod >/dev/null 2>&1; then
            kubectl create secret generic postgres-cluster-secret \
              --namespace inventory-prod \
              --type=kubernetes.io/basic-auth \
              --from-literal=username="${{ secrets.POSTGRES_USER }}" \
              --from-literal=password="${{ secrets.POSTGRES_PASSWORD }}"
          fi

          kubectl create secret generic database-credentials \
            --namespace inventory-prod \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_DB="inventory_db" \
            --from-literal=MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_ROOT_USERNAME }}" \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_ROOT_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic backend-credentials \
            --namespace inventory-prod \
            --from-literal=DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres-cluster-rw.inventory-prod.svc.cluster.local:5432/inventory_db" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=POSTGRES_DB="inventory_db" \
            --from-literal=MONGO_URI="mongodb://${{ secrets.MONGO_ROOT_USERNAME }}:${{ secrets.MONGO_ROOT_PASSWORD }}@mongo-service.inventory-prod.svc.cluster.local:27017" \
            --from-literal=REDIS_URL="redis://redis-service.inventory-prod.svc.cluster.local:6379" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/02-persistent-volume-claims.yaml
          kubectl apply -f k8s/03-databases.yaml
          kubectl apply -f k8s/postgres-cluster.yaml

          kubectl get cluster postgres-cluster -n inventory-prod || true

          kubectl apply -f k8s/04-backend.yaml
          kubectl apply -f k8s/backend-pdb.yaml
          kubectl apply -f k8s/resource-quota.yaml
          kubectl apply -f k8s/limit-range.yaml
          kubectl apply -f k8s/network-policy.yaml

          kubectl rollout restart deployment/inventory-backend -n inventory-prod
          kubectl rollout status deployment/inventory-backend -n inventory-prod --timeout=300s

          kubectl apply -f k8s/backend-hpa.yaml

      - name: Execute Automated Layer 7 Health Guardrail
        shell: bash
        run: |
          set -e
          export KUBECONFIG=$HOME/.kube/config

          echo "Waiting for Backend HTTP Endpoint..."

          for i in {1..30}; do
            if curl -fsS http://localhost:30080/docs >/dev/null; then
              echo "Backend is reachable."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend never became reachable."
              exit 1
            fi

            echo "Waiting... ($i/30)"
            sleep 5
          done

          python3 scripts/validate_cluster_health.py "http://localhost:30080"

      - name: Rollback on Failure
        if: failure()
        shell: bash
        run: |
          export KUBECONFIG=$HOME/.kube/config
          echo "Deployment failed."
          kubectl rollout undo deployment/inventory-backend -n inventory-prod || true
          kubectl rollout status deployment/inventory-backend -n inventory-prod --timeout=300s || true
          exit 1

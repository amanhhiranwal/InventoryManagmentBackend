events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    server {
        listen 8000;
        server_name localhost;

        client_max_body_size 20M;

        # 1. Auth Service Routes
        location ~ ^/api/v1/(auth|users|roles|rbac|profile|companies|menus) {
            set $upstream_auth auth_service:8001;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Profile uploads
        location /uploads {
            set $upstream_auth auth_service:8001;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. CRM Service Routes
        location ~ ^/api/v1/(leads|lead-sources|workflows|customer-types) {
            set $upstream_crm crm_service:8002;
            proxy_pass http://$upstream_crm;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Inventory Service Routes
        location ~ ^/api/v1/(inventory|product-types|category-groups|units) {
            set $upstream_inventory inventory_service:8003;
            proxy_pass http://$upstream_inventory;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Sales Service Routes
        location ~ ^/api/v1/(orders|customers|locations|states) {
            set $upstream_sales sales_service:8004;
            proxy_pass http://$upstream_sales;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Gateway Root Check
        location / {
            return 200 '{"success":true,"message":"Nginx API Gateway Running"}';
            add_header Content-Type application/json;
        }
    }
}

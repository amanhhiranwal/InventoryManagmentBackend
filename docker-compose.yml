services:
  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${DOCKER_POSTGRES_HOST:-postgres_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${AUTH_DB:-auth_db}
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo_db:27017/}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis_cache}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
      - PYTHONPATH=/app
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  crm_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    command: uvicorn services.crm_service.main:app --host 0.0.0.0 --port 8002 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${DOCKER_POSTGRES_HOST:-postgres_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${CRM_DB:-crm_db}
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo_db:27017/}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis_cache}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
      - PYTHONPATH=/app
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  inventory_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    command: uvicorn services.inventory_service.main:app --host 0.0.0.0 --port 8003 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${DOCKER_POSTGRES_HOST:-postgres_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${INVENTORY_DB:-inventory_db}
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo_db:27017/}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis_cache}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
      - PYTHONPATH=/app
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  sales_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_service
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - .:/app
    command: uvicorn services.sales_service.main:app --host 0.0.0.0 --port 8004 --reload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${DOCKER_POSTGRES_HOST:-postgres_db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${SALES_DB:-sales_db}
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo_db:27017/}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis_cache}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
      - PYTHONPATH=/app
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:8000"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - crm_service
      - inventory_service
      - sales_service

  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo_db:
    image: mongo:7.0
    container_name: mongo_db
    restart: unless-stopped
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7.2-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
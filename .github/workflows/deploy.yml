name: CI/CD Pipeline - Backend

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend CI (Syntax & Compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        run: |
          python -m py_compile $(find app -name "*.py")
          python -m py_compile sync_schema.py check_and_seed_db.py

  deploy:
    name: Deploy FastAPI Backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "=========================================="
            echo "==> Deploying Backend to ${{ secrets.SERVER_HOST }}..."
            echo "=========================================="

            APP_DIR="/var/www/saas"
            BACKEND_DIR="$APP_DIR/backend"

            if [ ! -d "$BACKEND_DIR" ]; then
              echo "Error: Backend directory $BACKEND_DIR does not exist."
              exit 1
            fi

            cd "$BACKEND_DIR"
            git config --global --add safe.directory "$BACKEND_DIR"

            BRANCH="${{ github.ref_name }}"
            echo "==> Fetching latest changes from branch $BRANCH..."
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            # Sync docker-compose.prod.yml if changed
            cp -f "$BACKEND_DIR/deploy/docker-compose.prod.yml" "$APP_DIR/docker-compose.prod.yml" 2>/dev/null || true

            echo "==> Building and starting backend container..."
            docker compose -f "$APP_DIR/docker-compose.prod.yml" build saas_backend
            docker compose -f "$APP_DIR/docker-compose.prod.yml" up -d saas_backend

            echo "==> Syncing database schemas & seeding..."
            docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T saas_backend python sync_schema.py
            docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T saas_backend python check_and_seed_db.py
            docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T saas_backend python apply_crm_workflow_schema.py

            echo "==> Waiting for backend healthcheck..."
            sleep 4
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:8050/api/v1/health > /dev/null; then
                echo "==> Backend is healthy and responding!"
                exit 0
              fi
              echo "Waiting for health check ($i/10)..."
              sleep 2
            done

            echo "Health check timed out! Recent container logs:"
            docker compose -f "$APP_DIR/docker-compose.prod.yml" logs --tail=50 saas_backend
            exit 1

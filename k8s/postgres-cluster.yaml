apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: inventory-prod

spec:
  instances: 11

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  storage:
    size: 10Gi

  bootstrap:
    initdb:
      database: inventory_db
      owner: admin
      secret:
        name: postgres-cluster-secret

  postgresql:
    parameters:
      max_wal_senders: "32"
      max_replication_slots: "32"
      wal_level: "logical"
      wal_keep_size: "512MB"

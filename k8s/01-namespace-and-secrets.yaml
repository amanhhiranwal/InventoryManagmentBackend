apiVersion: v1
kind: Namespace
metadata:
  name: inventory-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: inventory-prod
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "supersecretpassword"
  POSTGRES_DB: "inventory_db"
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "supersecretpassword"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-credentials
  namespace: inventory-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://admin:supersecretpassword@postgres-cluster-rw.inventory-prod.svc.cluster.local:5432/inventory_db"
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "supersecretpassword"
  POSTGRES_DB: "inventory_db"
  MONGO_URI: "mongodb://admin:supersecretpassword@mongo-service.inventory-prod.svc.cluster.local:27017"
  REDIS_URL: "redis://redis-service.inventory-prod.svc.cluster.local:6379"
  JWT_SECRET_KEY: "your_generated_jwt_secret_key_here"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventory-prod
data:
  APP_NAME: "Inventory Backend Engine"
  APP_VERSION: "1.0.0"
  ENV: "production"
  POSTGRES_HOST: "postgres-cluster-rw"
  POSTGRES_PORT: "5432"
  MONGO_HOST: "mongo-service"
  MONGO_PORT: "27017"
  MONGO_DB: "inventory_mongo_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

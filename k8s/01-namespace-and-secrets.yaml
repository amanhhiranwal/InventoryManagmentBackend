apiVersion: v1
kind: Namespace
metadata:
  name: inventory-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventory-prod
data:
  APP_NAME: "Inventory Backend Engine"
  APP_VERSION: "1.0.0"
  ENV: "production"

  POSTGRES_HOST: "postgres-cluster-rw"
  POSTGRES_PORT: "5432"

  MONGO_HOST: "mongo-service"
  MONGO_PORT: "27017"
  MONGO_DB: "inventory_mongo_db"

  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

name: Production Self-Hosted CI/CD Pipeline

on:
  push:
    branches: [ staging, master ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-backend:latest

      - name: Deploy Manifests to Local K3s Cluster
        run: |
          export KUBECONFIG=$HOME/.kube/config

          kubectl apply -f k8s/01-namespace-and-secrets.yaml
          kubectl apply -f k8s/02-persistent-volume-claims.yaml
          kubectl apply -f k8s/03-databases.yaml
          kubectl apply -f k8s/postgres-cluster.yaml
          kubectl apply -f k8s/04-backend.yaml
          kubectl apply -f k8s/backend-hpa.yaml

          kubectl rollout restart deployment/inventory-backend -n inventory-prod
          kubectl rollout status deployment/inventory-backend -n inventory-prod --timeout=120s

      - name: Execute Automated Layer 7 Health Guardrail
        run: |
          export KUBECONFIG=$HOME/.kube/config

          python3 scripts/validate_cluster_health.py "http://localhost:30080" || \
            (echo "CRITICAL: Health check failed! Rolling back deployment..." && \
             kubectl rollout undo deployment/inventory-backend -n inventory-prod && exit 1)

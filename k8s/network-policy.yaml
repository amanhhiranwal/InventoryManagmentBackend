# Use case:
# Restricts network communication so only approved Kubernetes components
# can communicate with workloads inside inventory-prod.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-network-policy
  namespace: inventory-prod

spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  ingress:

    # ---------------------------------------------------------
    # Allow traffic from NGINX Ingress Controller
    # ---------------------------------------------------------
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

    # ---------------------------------------------------------
    # Allow monitoring stack (Prometheus scraping)
    # ---------------------------------------------------------
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

    # ---------------------------------------------------------
    # Allow communication inside inventory-prod namespace
    # ---------------------------------------------------------
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inventory-prod

    # ---------------------------------------------------------
    # Backend -> Backend (future horizontal scaling)
    # ---------------------------------------------------------
    - from:
        - podSelector:
            matchLabels:
              app: inventory-backend

    # ---------------------------------------------------------
    # MongoDB
    # ---------------------------------------------------------
    - from:
        - podSelector:
            matchLabels:
              app: mongo-db

    # ---------------------------------------------------------
    # Redis
    # ---------------------------------------------------------
    - from:
        - podSelector:
            matchLabels:
              app: redis-cache

    # ---------------------------------------------------------
    # PostgreSQL (CloudNativePG)
    # ---------------------------------------------------------
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster

  egress:

    # ---------------------------------------------------------
    # DNS
    # ---------------------------------------------------------
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # ---------------------------------------------------------
    # Backend -> MongoDB
    # ---------------------------------------------------------
    - to:
        - podSelector:
            matchLabels:
              app: mongo-db

    # ---------------------------------------------------------
    # Backend -> Redis
    # ---------------------------------------------------------
    - to:
        - podSelector:
            matchLabels:
              app: redis-cache

    # ---------------------------------------------------------
    # Backend -> PostgreSQL
    # ---------------------------------------------------------
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster

    # ---------------------------------------------------------
    # HTTPS
    # ---------------------------------------------------------
    - ports:
        - protocol: TCP
          port: 443

    # ---------------------------------------------------------
    # HTTP
    # ---------------------------------------------------------
    - ports:
        - protocol: TCP
          port: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  namespace: inventory-prod
spec:
  replicas: 4
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: inventory-backend

  template:
    metadata:
      labels:
        app: inventory-backend

    spec:
      securityContext:
        fsGroup: 10001

      containers:
        - name: backend
          image: atindimrimakerspace/inventory-backend:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-credentials

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15

          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads

      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: inventory-prod
spec:
  type: NodePort
  selector:
    app: inventory-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
